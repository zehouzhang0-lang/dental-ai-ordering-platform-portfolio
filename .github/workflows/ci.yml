name: Validate sanitized portfolio archive

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan archive boundaries
        run: pnpm security:scan

      - name: Start isolated test infrastructure
        run: |
          docker compose up -d --wait mysql redis minio
          bash scripts/ensure-test-database.sh

      - name: Run backend tests
        env:
          TZ: Asia/Shanghai
        run: bash scripts/with-jdk21.sh ./mvnw -Duser.timezone=Asia/Shanghai -f backend/pom.xml test

      - name: Build frontend
        run: pnpm build:frontend

      - name: Stop isolated test infrastructure
        if: always()
        run: docker compose down -v
