name: Validate private portfolio archive

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan archive boundaries
        run: pnpm security:scan

      - name: Start isolated test infrastructure
        run: |
          docker compose up -d --wait mysql redis minio
          bash scripts/ensure-test-database.sh

      - name: Run backend tests
        run: bash scripts/with-jdk21.sh ./mvnw -f backend/pom.xml test

      - name: Build frontend
        run: pnpm build:frontend

      - name: Stop isolated test infrastructure
        if: always()
        run: docker compose down -v
