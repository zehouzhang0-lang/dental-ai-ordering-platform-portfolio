spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_TEST_DATABASE:ai_order_platform_test}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_TEST_USER:ai_order_test}
spring.datasource.password=${MYSQL_TEST_PASSWORD:change-me-test}
spring.flyway.locations=classpath:db/migration,classpath:db/testdata
# Keep tests in a dedicated logical Redis database. The test safety guard rejects overrides.
spring.data.redis.database=15

app.auth.token-secret=${APP_AUTH_TOKEN_SECRET:local-dev-change-me-auth-secret}
app.auth.token-ttl-seconds=${APP_AUTH_TOKEN_TTL_SECONDS:7200}
app.auth.refresh-token-ttl-seconds=${APP_AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
app.auth.allow-bootstrap-headers=${APP_AUTH_ALLOW_BOOTSTRAP_HEADERS:true}
app.auth.allow-role-fallback=${APP_AUTH_ALLOW_ROLE_FALLBACK:true}
app.file.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
app.file.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://127.0.0.1:9000}}
app.file.region=${MINIO_REGION:us-east-1}
app.file.access-key=${MINIO_ROOT_USER:minioadmin}
app.file.secret-key=${MINIO_ROOT_PASSWORD:change-me-minio}
app.file.bucket=${MINIO_TEST_BUCKET:ai-order-test-private}
app.file.upload-url-ttl-seconds=${FILE_UPLOAD_URL_TTL_SECONDS:900}
app.file.preview-url-ttl-seconds=${FILE_PREVIEW_URL_TTL_SECONDS:900}
app.file.download-url-ttl-seconds=${FILE_DOWNLOAD_URL_TTL_SECONDS:7200}
app.file.max-file-size-bytes=${FILE_MAX_FILE_SIZE_BYTES:524288000}
app.file.allowed-content-types=${FILE_ALLOWED_CONTENT_TYPES:application/pdf,model/stl,application/sla,application/octet-stream,text/plain,image/png,image/jpeg,image/webp,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/zip,application/x-zip-compressed}
app.file.max-files-per-order=${FILE_MAX_FILES_PER_ORDER:30}
app.notification.instance-id=test-${random.uuid}
app.notification.redis-broadcast-enabled=false
app.workflow.standard-time.formal-enabled=true
app.ai.external-alert.webhook-enabled=false
app.ai.external-alert.scheduler-enabled=false
