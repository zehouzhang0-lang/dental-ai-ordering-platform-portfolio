server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-order-platform
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_order_platform}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:ai_order}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:local-dev-change-me-auth-secret}
    token-ttl-seconds: ${APP_AUTH_TOKEN_TTL_SECONDS:7200}
    refresh-token-ttl-seconds: ${APP_AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
    # Header-based identities are test-only compatibility scaffolding. Local and production
    # runtimes must use the login-issued bearer token unless explicitly opted in for a test.
    allow-bootstrap-headers: ${APP_AUTH_ALLOW_BOOTSTRAP_HEADERS:false}
    allow-role-fallback: ${APP_AUTH_ALLOW_ROLE_FALLBACK:false}
  file:
    # Internal storage calls use the Docker/service-network endpoint. Browser-facing
    # pre-signed URLs must be signed with the externally reachable origin because
    # the Host header is part of the AWS V4 signature.
    endpoint: ${MINIO_INTERNAL_ENDPOINT:${MINIO_ENDPOINT:http://127.0.0.1:9000}}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_INTERNAL_ENDPOINT:${MINIO_ENDPOINT:http://127.0.0.1:9000}}}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me-minio}
    bucket: ${MINIO_BUCKET:ai-order-private}
    upload-url-ttl-seconds: ${FILE_UPLOAD_URL_TTL_SECONDS:900}
    preview-url-ttl-seconds: ${FILE_PREVIEW_URL_TTL_SECONDS:900}
    download-url-ttl-seconds: ${FILE_DOWNLOAD_URL_TTL_SECONDS:7200}
    max-file-size-bytes: ${FILE_MAX_FILE_SIZE_BYTES:524288000}
    allowed-content-types: ${FILE_ALLOWED_CONTENT_TYPES:application/pdf,model/stl,application/sla,application/octet-stream,text/plain,image/png,image/jpeg,image/webp,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/zip,application/x-zip-compressed}
    allowed-filename-extensions: ${FILE_ALLOWED_FILENAME_EXTENSIONS:stl,sla,ply,obj,pdf,jpg,jpeg,png,webp,dcm,dicom,zip,doc,docx,txt}
    max-files-per-order: ${FILE_MAX_FILES_PER_ORDER:30}
  notification:
    instance-id: ${APP_INSTANCE_ID:${random.uuid}}
    redis-broadcast-enabled: ${NOTIFICATION_REDIS_BROADCAST_ENABLED:false}
    redis-channel: ${NOTIFICATION_REDIS_CHANNEL:ai-order:notifications}
  workflow:
    standard-time:
      # 客户正式标准工时尚未提供。关闭时仅保留草稿维护底座，不生成 SLA 或绩效口径。
      formal-enabled: ${WORKFLOW_STANDARD_TIME_FORMAL_ENABLED:false}
  ai:
    provider: ${AI_PROVIDER:deterministic}
    max-requests-per-user-hour: ${AI_MAX_REQUESTS_PER_USER_HOUR:120}
    max-model-retries: ${AI_MODEL_MAX_RETRIES:1}
    input-token-cost-microusd: ${AI_INPUT_TOKEN_COST_MICROUSD:0}
    output-token-cost-microusd: ${AI_OUTPUT_TOKEN_COST_MICROUSD:0}
    daily-budget-microusd: ${AI_DAILY_BUDGET_MICROUSD:0}
    admin-daily-budget-microusd: ${AI_ADMIN_DAILY_BUDGET_MICROUSD:0}
    cs-daily-budget-microusd: ${AI_CS_DAILY_BUDGET_MICROUSD:0}
    doctor-daily-budget-microusd: ${AI_DOCTOR_DAILY_BUDGET_MICROUSD:0}
    worker-daily-budget-microusd: ${AI_WORKER_DAILY_BUDGET_MICROUSD:0}
    budget-notification-enabled: ${AI_BUDGET_NOTIFICATION_ENABLED:true}
    budget-circuit-breaker-enabled: ${AI_BUDGET_CIRCUIT_BREAKER_ENABLED:false}
    deepseek:
      enabled: ${AI_DEEPSEEK_ENABLED:false}
      base-url: ${AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${AI_DEEPSEEK_MODEL:deepseek-chat}
      daily-budget-microusd: ${AI_DEEPSEEK_DAILY_BUDGET_MICROUSD:0}
      temperature: ${AI_DEEPSEEK_TEMPERATURE:0.2}
      max-tokens: ${AI_DEEPSEEK_MAX_TOKENS:800}
      connect-timeout-seconds: ${AI_DEEPSEEK_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${AI_DEEPSEEK_READ_TIMEOUT_SECONDS:45}
    langchain:
      enabled: ${AI_LANGCHAIN_ENABLED:false}
      provider: ${AI_LANGCHAIN_PROVIDER:deepseek}
    external-alert:
      webhook-enabled: ${AI_EXTERNAL_ALERT_WEBHOOK_ENABLED:false}
      webhook-url: ${AI_EXTERNAL_ALERT_WEBHOOK_URL:}
      connect-timeout-seconds: ${AI_EXTERNAL_ALERT_WEBHOOK_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${AI_EXTERNAL_ALERT_WEBHOOK_READ_TIMEOUT_SECONDS:10}
      scheduler-enabled: ${AI_EXTERNAL_ALERT_SCHEDULER_ENABLED:false}
      scheduler-batch-size: ${AI_EXTERNAL_ALERT_SCHEDULER_BATCH_SIZE:50}
      scheduler-fixed-delay-millis: ${AI_EXTERNAL_ALERT_SCHEDULER_FIXED_DELAY_MILLIS:60000}
      scheduler-initial-delay-millis: ${AI_EXTERNAL_ALERT_SCHEDULER_INITIAL_DELAY_MILLIS:60000}
      max-attempts: ${AI_EXTERNAL_ALERT_MAX_ATTEMPTS:3}
      webhook-signing-enabled: ${AI_EXTERNAL_ALERT_WEBHOOK_SIGNING_ENABLED:false}
      webhook-signing-secret: ${AI_EXTERNAL_ALERT_WEBHOOK_SIGNING_SECRET:}
      receiver-verification-enabled: ${AI_EXTERNAL_ALERT_RECEIVER_VERIFICATION_ENABLED:false}
      receiver-signing-secret: ${AI_EXTERNAL_ALERT_RECEIVER_SIGNING_SECRET:}
      receiver-replay-window-seconds: ${AI_EXTERNAL_ALERT_RECEIVER_REPLAY_WINDOW_SECONDS:300}
