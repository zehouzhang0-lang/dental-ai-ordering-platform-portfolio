  "/ai/translate":
    post:
      tags:
      - AI
      summary: AI-1 翻译助手（客服端）
      description: |
        权限：CS / ADMIN
        返回翻译草稿，客服确认后需调用 /orders/{orderId}/review 写入生产指令。
        本接口只负责生成草稿，不写入任何订单字段。
        任务 9D.15 第一增量：当后端配置 AI_PROVIDER=deepseek、AI_DEEPSEEK_ENABLED=true 且注入 DEEPSEEK_API_KEY 时，通过 OpenAI-compatible /chat/completions 调用 DeepSeek；未启用或未配置真实 key 时保持 deterministic-placeholder 安全占位输出。
        任务 9D.35 第一增量：当 AI_BUDGET_CIRCUIT_BREAKER_ENABLED=true 且近 24 小时成功调用估算成本已达到 AI_DAILY_BUDGET_MICROUSD 时，本接口不再外呼真实模型，返回 deterministic fallback，并写入 AI_BUDGET_CIRCUIT_OPEN 治理审计。
        任务 9D.37 第一增量：预算跨线 AI_BUDGET_EXCEEDED 或预算熔断 AI_BUDGET_CIRCUIT_OPEN 会写入 ai_external_alert_outbox 待发送事实，send_status=PENDING；当前不调用真实外部告警渠道。
        任务 9D.38 第一增量：当 AI_BUDGET_CIRCUIT_BREAKER_ENABLED=true 且当前角色的 AI_ADMIN_DAILY_BUDGET_MICROUSD / AI_CS_DAILY_BUDGET_MICROUSD / AI_DOCTOR_DAILY_BUDGET_MICROUSD / AI_WORKER_DAILY_BUDGET_MICROUSD 已超限时，不再外呼真实模型，并写入 AI_BUDGET_ROLE_CIRCUIT_OPEN 治理审计和 outbox。
        任务 9D.39 第一增量：当 AI_BUDGET_CIRCUIT_BREAKER_ENABLED=true 且当前 AI_DEEPSEEK_MODEL 的 AI_DEEPSEEK_DAILY_BUDGET_MICROUSD 已超限时，不再外呼真实模型，并写入 AI_BUDGET_MODEL_CIRCUIT_OPEN 治理审计和 outbox。
        任务 9D.40 第一增量：AI 审计写入 prompt_version；真实模型输出命中敏感防护时，返回安全保护文案，并写入 AI_OUTPUT_GUARDED / ai-governance-output-guard 治理审计。
        任务 9D.41 第一增量：ai_external_alert_outbox 的 PENDING 记录可由本地发送器推进为 SENT 或 FAILED，并累计 attempts / 记录 last_error。
        任务 9D.43 第一增量：发送器默认仍是本地 dry-run；只有显式配置 AI_EXTERNAL_ALERT_WEBHOOK_ENABLED=true 且提供 AI_EXTERNAL_ALERT_WEBHOOK_URL 时，EXTERNAL_ALERT 通道才会把 outbox payload 以 application/json POST 到外部 webhook，不提交任何真实渠道密钥。
        任务 9D.44 第一增量：AI 外部告警调度器默认关闭；只有显式配置 AI_EXTERNAL_ALERT_SCHEDULER_ENABLED=true 时，才会按 AI_EXTERNAL_ALERT_SCHEDULER_BATCH_SIZE 批量调用发送器处理 PENDING outbox。本增量不做分布式锁、复杂重试、死信或真实渠道密钥。
        任务 9D.45 第一增量：webhook 非 2xx 或连接异常会累计 attempts 并写 last_error；未达到 AI_EXTERNAL_ALERT_MAX_ATTEMPTS 时保持 PENDING 等待下次调度，达到上限后标记 DEAD_LETTER。本增量不做分布式锁、退避调度、死信管理页面或生产 webhook 联调。
        任务 9D.46 第一增量：发送器会先用条件更新把 PENDING outbox 领取为事务内 SENDING，领取成功后才允许外呼 webhook；重复触发或并发 sender 不能对同一条 outbox 造成重复外呼。本增量不做签名/鉴权、退避调度、告警抑制、监控指标或生产 webhook 联调。
        任务 9D.47 第一增量：默认不签名；显式设置 AI_EXTERNAL_ALERT_WEBHOOK_SIGNING_ENABLED=true 并通过安全渠道注入 AI_EXTERNAL_ALERT_WEBHOOK_SIGNING_SECRET 后，webhook 请求会携带 X-AI-Alert-Timestamp、X-AI-Alert-Nonce 和 X-AI-Alert-Signature: sha256=<HMAC-SHA256(timestamp.nonce.requestBody)>。本增量不提交真实 secret，不做生产 webhook 联调。
        任务 9D.71 第一增量：新增本地接收端验签 / 防重放验收桩 `/ai/external-alerts/receive`，默认 `AI_EXTERNAL_ALERT_RECEIVER_VERIFICATION_ENABLED=false`；显式启用并注入 `AI_EXTERNAL_ALERT_RECEIVER_SIGNING_SECRET` 后，会校验 timestamp 时间窗、nonce 重放和 HMAC 签名。本增量不接真实外部服务，不提交真实 secret。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AiTranslateRequest"
      responses:
        '200':
          description: 返回翻译草稿，不自动写入业务字段
          content:
            application/json:
              schema:
                allOf:
