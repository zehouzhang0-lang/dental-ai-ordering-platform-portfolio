  "/api/auth/login":
    post:
      tags:
      - Auth
      summary: 登录
      description: 登录入口必须与账号角色匹配：DOCTOR=医生端，CS=客服端，PRODUCTION=生产端，ADMIN=管理端。
      security: []
      requestBody:
        required: true
        content:
          application/json:
