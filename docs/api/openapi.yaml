        OPEN、CLAIMED、SUBMITTED、INTERNAL_REVIEW、INTERNAL_REJECTED 或 CANCELLED：
        尚无医生可见版本时返回订单外部状态；已有医生可见版本时仅返回
        PENDING_DOCTOR / DOCTOR_CONFIRMED / DOCTOR_REJECTED。
      oneOf:
      - "$ref": "#/components/schemas/DesignTaskStatus"
