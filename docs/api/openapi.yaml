      operationId: getExportRequests
      responses:
        '200': {description: 导出申请列表, content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/ExportRequestResponse"}}}}}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
        default: {"$ref": "#/components/responses/DefaultError"}
    post:
      tags: [Admin]
      summary: 创建导出申请
      description: |
        权限码：export:execute，敏感数据集另需 export:sensitive 且数据范围必须为 ALL。
        acknowledged 必须显式为 true —— 客户要求「导出需要反复确认」，界面上的确认框绕得过去，接口调用绕不过去。
        敏感数据集创建后 approval_status=PENDING，需他人批准；其余为 NOT_REQUIRED，可直接下载。
      operationId: postExportRequest
      requestBody: {required: true, content: {application/json: {schema: {"$ref": "#/components/schemas/CreateExportRequest"}}}}
