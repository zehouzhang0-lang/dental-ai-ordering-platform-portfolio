    post:
      tags: [Order]
      summary: 登记试戴完成
      description: 权限码：order:try-in-manage（CS / ADMIN）。登记后医生可在同一订单上选择成品与材料。
      operationId: postOrderTryInComplete
      parameters:
      - {name: orderId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: {required: false, content: {application/json: {schema: {"$ref": "#/components/schemas/TryInCompleteRequest"}}}}
