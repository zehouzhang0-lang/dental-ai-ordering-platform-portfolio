  "/ws/connect":
    get:
      tags:
      - Notification
      summary: WebSocket 连接端点（仅文档说明，非 REST 接口）
      description: |
        连接地址：wss://api.yourdomain.com/ws/connect?token={access_token}
        连接时服务端校验 Token，Token 无效则拒绝连接。

        ## 推送事件类型（event 字段）

        | event | 触发条件 | 推送对象 |
        |---|---|---|
        | ORDER_SUBMITTED | 医生提交订单 | CS |
        | ORDER_APPROVED | 客服审核通过 | DOCTOR + WORKER |
        | ORDER_REJECTED | 订单被驳回 | DOCTOR |
        | DESIGN_TASK_TRANSFERRED | 管理员转派设计任务 | 新领取人 |
        | DESIGN_DRAFT_SUBMITTED | 领取人提交设计稿进入内部审核 | 授权设计组长 + ADMIN |
        | DESIGN_DRAFT_INTERNAL_APPROVED | 设计组长内部审核通过 | 订单医生 |
        | DESIGN_DRAFT_INTERNAL_REJECTED | 设计组长内部驳回 | 该版本原上传人 |
        | DESIGN_DRAFT_DOCTOR_CONFIRMED | 医生确认设计稿 | 当前领取人 + 内审人 + CS |
        | DESIGN_DRAFT_DOCTOR_REJECTED | 医生驳回设计稿 | 该版本原上传人 + 内审人 + CS |
        | TASK_ASSIGNED | 工序任务分配 | 对应 WORKER |
        | TASK_REASSIGNED | 工序任务转派 | 新旧 WORKER |
        | MESSAGE_RECEIVED | 新消息（已通过审核或无需审核）| 目标接收方 |
        | MESSAGE_PENDING_REVIEW | 生产端消息待审核 | CS |
        | MESSAGE_REVIEW_REJECTED | 消息被驳回 | 发送人 |
        | PROCESS_BLOCKED | 并联节点卡死（超时告警）| ADMIN |
        | REWORK_CREATED | 出检失败生成返工记录 | 目标 WORKER |
        | REWORK_CLOSED | 返工重新出检通过后关闭 | CS |
        | ORDER_SHIPPED | 发货完成 | DOCTOR |
        | ORDER_COMPLETED | 医生确认收货 | CS + ADMIN |
        | BILL_UPLOADED | 账单上传 | DOCTOR |

        ## 推送消息格式
        ```json
        {
          "event": "ORDER_APPROVED",
          "order_id": 12345,
          "order_no": "ORD-20260627-001",
          "message": "您的订单已审核通过，正在进入生产流程",
          "timestamp": "2026-06-27T10:00:00Z"
        }
        ```
      responses:
        '101':
          description: WebSocket 升级成功
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: getWsConnect
