          format: int64
        budget_notification_enabled:
          type: boolean
        budget_circuit_breaker_enabled:
          type: boolean
    Ai3SafetyCase:
      type: object
      properties:
        case_id:
          type: string
        question_family:
          type: string
        expected_status:
          type: string
        safe_read_model:
          type: string
        forbidden_fields:
          type: array
          items:
            type: string
    Ai5TemplateBoundary:
      type: object
      properties:
        template_version:
          type: string
        customer_template_status:
          type: string
          description: CUSTOMER_TEMPLATE_UNCONFIRMED 表示客户模板仍未确认。
        requires_customer_template_confirmation:
          type: boolean
        auto_write_allowed:
          type: boolean
        human_confirmation_required:
          type: boolean
    AiRealExternalIntegrationStatus:
      type: object
      properties:
        integration_status:
          type: string
          description: REAL_EXTERNAL_INTEGRATION_PENDING 表示真实 key / webhook / 签字仍待验收。
        deepseek_key_status:
          type: string
        webhook_status:
          type: string
        customer_signature_status:
          type: string
        task8_status:
          type: string
    AiGovernanceCostTrendResponse:
      type: object
      properties:
        days:
          type: integer
          description: 查询窗口天数，默认 7，服务端限制为 1 到 31。
        points:
          type: array
          items:
            "$ref": "#/components/schemas/AiGovernanceCostTrendPoint"
        total_success_count:
          type: integer
          format: int64
        total_estimated_cost_microusd:
          type: integer
          format: int64
    AiGovernanceCostTrendPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          description: 聚合日期。
        success_count:
          type: integer
          format: int64
          description: 当天成功模型调用次数。
        estimated_cost_microusd:
          type: integer
          format: int64
          description: 当天成功模型调用估算成本，单位 microUSD。
        model_count:
          type: integer
          format: int64
          description: 当天出现过成功调用的模型数量。
    AiExternalAlertSummaryResponse:
      type: object
      properties:
        status_counts:
          type: array
          description: 按 send_status 聚合的 outbox 数量分布。
          items:
            "$ref": "#/components/schemas/AiExternalAlertStatusCount"
        pending_count:
          type: integer
          format: int64
        sending_count:
          type: integer
          format: int64
        sent_count:
          type: integer
          format: int64
        failed_count:
          type: integer
          format: int64
        dead_letter_count:
          type: integer
          format: int64
        latest_failure:
          nullable: true
          "$ref": "#/components/schemas/AiExternalAlertFailure"
        oldest_pending_created_at:
          type: string
          format: date-time
          nullable: true
          description: 最老一条 PENDING outbox 的创建时间；无待发送记录时为空。
    AiExternalAlertStatusCount:
      type: object
      properties:
        send_status:
          type: string
          enum:
          - PENDING
          - SENDING
          - SENT
          - FAILED
          - DEAD_LETTER
        count:
          type: integer
          format: int64
    AiExternalAlertFailure:
      type: object
      properties:
        alert_id:
          type: integer
          format: int64
        alert_type:
          type: string
        send_status:
          type: string
          enum:
          - FAILED
          - DEAD_LETTER
        attempts:
          type: integer
        last_error:
          type: string
          nullable: true
          description: 已做基础脱敏的最近错误摘要，不返回真实 webhook URL、密钥、prompt 原文或模型原始响应。
        updated_at:
          type: string
          format: date-time
    AiExternalAlertListResponse:
      type: object
      properties:
        limit:
          type: integer
          description: 本次查询使用的返回上限，服务端限制为 1 到 100。
        records:
          type: array
          items:
            "$ref": "#/components/schemas/AiExternalAlertRecord"
    AiExternalAlertRecord:
      type: object
      properties:
        alert_id:
          type: integer
          format: int64
        event_type:
          type: string
          description: outbox 的 alert_type，对外按 event_type 呈现。
        send_status:
          type: string
          enum:
          - PENDING
          - SENDING
          - SENT
          - FAILED
          - DEAD_LETTER
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attempts:
          type: integer
          description: outbox 当前累计发送尝试次数。
        last_error:
          type: string
          nullable: true
          description: 仅 FAILED / DEAD_LETTER 记录返回已脱敏错误摘要；不返回真实 webhook URL、密钥、prompt 原文、模型原始响应或上游敏感响应。
        last_attempted_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次发送尝试时间；无尝试记录时为 null。
    AiExternalAlertReceiverResponse:
      type: object
      properties:
        accepted:
          type: boolean
          description: 当前本地接收端验签是否通过。
        event_type:
          type: string
          description: 从请求 JSON 的 event 字段提取的事件类型；不会返回原始 payload。
        nonce:
          type: string
          description: 已接受的 nonce；同一进程窗口内重复 nonce 会被拒绝。
    MissingInfoResponse:
      type: object
      properties:
        is_complete:
          type: boolean
        missing_items:
          type: array
          items:
            type: object
            properties:
              field_key:
                type: string
              field_label:
                type: string
              tip:
                type: string
    NotificationItem:
      type: object
      properties:
        notification_id:
          type: integer
          format: int64
        event_id:
          type: integer
          format: int64
        event:
          type: string
          description: 预算超限通知使用 AI_BUDGET_EXCEEDED。
          example: BILL_UPLOADED
        order_id:
          type: integer
          format: int64
          nullable: true
        order_no:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
          description: 面向接收人的脱敏通知文案
        read_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    NotificationListResponse:
      type: array
      items:
        "$ref": "#/components/schemas/NotificationItem"
    UnreadCountResponse:
      type: object
      properties:
        unread_count:
          type: integer
          format: int64
    MarkAllReadResponse:
      type: object
      properties:
        updated_count:
          type: integer
  responses:
    BadRequest:
      description: 请求参数错误或校验失败
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未登录或 Token 无效
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 无权限或数据范围拒绝
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: 业务状态冲突或幂等冲突
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: 外部依赖或存储服务不可用
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    DefaultError:
      description: 未分类错误响应
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
security:
- BearerAuth: []
paths:
  "/dashboards/phase-one-ab":
    get:
      tags:
      - Dashboard
      summary: 一期 A/B 内部看板月度趋势与客户排名
      description: |
        权限：CS / ADMIN / WORKER。
        返回当前数据范围内的本地月度趋势 / 客户排名第一段聚合，用于客服和生产内部看板。
        该接口不代表客户最终统计口径、真实支付平台、真实物流平台或真实环境验收完成；DOCTOR 禁止访问。
      responses:
        '200':
          description: 一期 A/B 内部看板聚合
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/CommonResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/PhaseOneAbDashboardResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: getPhaseOneAbDashboard
  "/dashboards/sales":
    get:
      tags:
      - Dashboard
      summary: 管理与客服接单、出货金额同比看板
      description: |
        权限：CS / ADMIN；WORKER / DOCTOR 禁止访问。
        接单金额优先按客服审核通过时间统计，历史订单没有审核状态记录时回退订单创建时间；出货金额按实际 shipped_at 统计。
        金额只累计 order_bill 中已录入的 CNY amount_cent，并返回已录金额订单数供页面展示覆盖率；不使用产品基础价推算或伪造销售额。
        默认返回本年截至今天与去年同期的累计金额，以及本年和去年 1-12 月接单 / 出货金额趋势。
      responses:
        '200':
          description: 接单与出货金额同比聚合
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/CommonResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/SalesDashboardResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: getSalesDashboard
  "/patients":
    get:
      tags:
      - Patient
      summary: 医生患者档案列表
      description: |
        权限：DOCTOR。只返回当前医生本人、当前诊所下的 ACTIVE 患者档案。
        支持按患者姓名、编号、电话、邮箱和标签检索；不包含跨诊所批量检索或 AI 历史推荐。
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: 患者档案分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/PatientListResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: getPatients
    post:
      tags:
      - Patient
      summary: 创建医生患者档案
      description: 权限：DOCTOR。创建的患者档案固定归属于当前医生和当前诊所。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatePatientRequest"
      responses:
        '200':
          description: 患者档案创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/PatientRecord"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postPatients
  "/patients/{patientId}":
    get:
      tags:
      - Patient
      summary: 查看患者档案详情
      description: 权限：DOCTOR。只返回当前医生本人、当前诊所下的患者档案。
