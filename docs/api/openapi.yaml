  "/performance":
    get:
      tags:
      - Performance
      summary: 获取绩效统计
      description: |
        任务 9D.66 第一增量：支持 start_date / end_date 按完成日期筛选绩效统计。
        权限：WORKER（只返回本人数据）/ ADMIN（可查全部）
        客户正式标准工时未启用时 performance_formula_version=STANDARD_TIME_PENDING；标准工时、覆盖率、准时率、工时效率和绩效参考分均不作为业务结果。
        绩效计算公式：
        - 完成数量 = 已完成 work_log 记录数
        - 有效工时 = SUM(effective_duration_seconds)
        - 返工次数 = 返工记录次数
        - 准时率 = 按标准工时内完成工序数 ÷ 总完成工序数
        - 通过率 = 一次出检通过数 ÷ 总出检数
        - 工时效率 = SUM(standard_duration) ÷ SUM(effective_duration_seconds) × 100%
        任务 9D.74 第一增量：
        - performance_formula_version = PHASE_ONE_DEFAULT_V1
        - 标准工时覆盖率 = 有标准工时的已完成工序数 ÷ 已完成工序数
        - 默认绩效分 = 工时效率 40% + 一次通过率 30% + 准时率 20% + 责任归因 10%
        - 当前默认公式仅用于一期统计验收，不作为工资或奖惩结算依据
      parameters:
      - name: user_id
        in: query
        schema:
          type: integer
          description: ADMIN 专用，不传则返回当前登录人
      - name: start_date
        in: query
        description: 按 work_log.finished_at 日期筛选，闭区间开始日期
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: 按 work_log.finished_at 日期筛选，闭区间结束日期；早于 start_date 时返回 400
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 绩效统计结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/PerformanceStats"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: getPerformance
