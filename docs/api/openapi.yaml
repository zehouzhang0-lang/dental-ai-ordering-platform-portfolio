  "/api/auth/refresh":
    post:
      tags:
      - Auth
      summary: 刷新 Access Token
      description: 使用仍有效且未登出的 refresh token 返回新的 accessToken，并轮换 refreshToken；客户端必须替换本地保存的 refreshToken。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenRequest"
      responses:
        '200':
          description: 刷新成功，返回新的 accessToken 和轮换后的 refreshToken
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postAuthRefresh
  "/api/auth/logout":
    post:
      tags:
      - Auth
      summary: 登出，服务端使 Token 失效
      description: 吊销请求体中的 refresh token；既有 accessToken 不做服务端黑名单，等待自然过期。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenRequest"
      responses:
        '200':
          description: 登出成功
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postAuthLogout
  "/doctor/account/settings":
