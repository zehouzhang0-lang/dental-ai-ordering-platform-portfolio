        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
        default: {"$ref": "#/components/responses/DefaultError"}
  "/orders/{orderId}/delivery-plan":
    get:
      tags: [Order]
      summary: 读取订单交期计划、过程确认、试戴与计价项
      description: |
        权限码：order:read-internal 或 order:read-doctor。医生仅限本人订单。
        交期 = min(产品标准周期, 订单周期上限) + 过程确认项数 × 每项天数 + 等待天数 + 在途天数，
        各项均取自 ordering_rule_config。estimate_status = PLACEHOLDER 表示用到了客户尚未确认的占位周期，
        界面必须标注「待确认」，不得表现为正式承诺交期。
      operationId: getOrderDeliveryPlan
      parameters:
      - {name: orderId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 交期计划, content: {application/json: {schema: {"$ref": "#/components/schemas/DeliveryPlanResponse"}}}}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
        default: {"$ref": "#/components/responses/DefaultError"}
  "/orders/{orderId}/delivery-plan/requested-date":
    put:
      tags: [Order]
      summary: 医生调整要求到货时间
      description: |
        权限码：order:write-doctor（DOCTOR，仅本人订单）。调整后重算与系统可行交期的差异；
        早于可行交期时 variance_flag = EARLIER_THAN_FEASIBLE，客服端订单视图出现时间异常提示并收到通知。
      operationId: putOrderDeliveryRequestedDate
      parameters:
      - {name: orderId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: {required: true, content: {application/json: {schema: {"$ref": "#/components/schemas/AdjustDeliveryDateRequest"}}}}
      responses:
        '200': {description: 交期计划, content: {application/json: {schema: {"$ref": "#/components/schemas/DeliveryPlanResponse"}}}}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
        default: {"$ref": "#/components/responses/DefaultError"}
  "/orders/{orderId}/process-confirmations/{confirmationCode}/request":
    post:
      tags: [Order]
      summary: 内部发起过程确认请求
      description: |
        权限码：order:process-confirm-request（CS / 生产 / ADMIN）。confirmationCode 取值：
        CAD_DESIGN / POST_MILLING_PHOTOS / POST_GLAZING_PHOTOS，且必须是医生下单时勾选过的环节。
        医生超过宽限期未回复时订单进入等待状态并按超时天数顺延交期。
      operationId: postOrderProcessConfirmationRequest
      parameters:
      - {name: orderId, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: confirmationCode, in: path, required: true, schema: {type: string}}
      requestBody: {required: false, content: {application/json: {schema: {"$ref": "#/components/schemas/ProcessConfirmationRequestBody"}}}}
      responses:
        '200': {description: 过程确认清单, content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/ProcessConfirmationResponse"}}}}}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
        default: {"$ref": "#/components/responses/DefaultError"}
  "/orders/{orderId}/process-confirmations/{confirmationCode}/respond":
    post:
      tags: [Order]
      summary: 医生回复过程确认
      description: 权限码：order:process-confirm-doctor（DOCTOR，仅本人订单）。回复后停止累计等待天数，已顺延的天数保留。
      operationId: postOrderProcessConfirmationRespond
      parameters:
      - {name: orderId, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: confirmationCode, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {"$ref": "#/components/schemas/ProcessConfirmationRespondRequest"}}}}
      responses:
        '200': {description: 过程确认清单, content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/ProcessConfirmationResponse"}}}}}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
        default: {"$ref": "#/components/responses/DefaultError"}
