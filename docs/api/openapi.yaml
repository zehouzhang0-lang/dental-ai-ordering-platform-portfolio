        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdatePatientRequest"
      responses:
        '200':
          description: 患者档案更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/PatientRecord"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: putPatientById
  "/patients/{patientId}/orders":
    get:
      tags:
      - Patient
      summary: 查看患者历史订单
      description: |
        权限：DOCTOR。只能查看当前医生本人患者绑定的历史订单。
        响应仅返回医生端外部状态，不返回 internal_status、production_note 或内部责任信息。
      parameters:
