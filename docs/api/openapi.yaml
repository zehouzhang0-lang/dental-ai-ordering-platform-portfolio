      operationId: getAccountHandoverPreview
      parameters:
      - {name: userId, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: successor_user_id, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 交接预览, content: {application/json: {schema: {"$ref": "#/components/schemas/HandoverPreviewResponse"}}}}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
        default: {"$ref": "#/components/responses/DefaultError"}
  "/accounts/{userId}/handover":
    post:
      tags: [Admin]
      summary: 执行账号交接与人员转移
      description: |
        权限码：account:handover；同时停用原账号另需 account:disable，跨部门另需 rbac:cross-dept。
        只转移「当前负责关系」（订单归属、患者负责医生、病例组、医生资料、进行中的设计与工序任务、
        未关闭返工的退回对象、设备责任人）。**已完成的工序、工时、质检、终检、返工关闭、状态流转、
        奖惩绩效全部保留原操作人**——客户原话「并保留之前得服务记录」。
        承接人必须与原责任人同一入口角色；医生之间还必须同诊所。
        acknowledged 必须为 true：交接是不可逆的批量改写。
      operationId: postAccountHandover
      parameters:
      - {name: userId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: {required: true, content: {application/json: {schema: {"$ref": "#/components/schemas/HandoverRequest"}}}}
      responses:
        '200': {description: 交接记录, content: {application/json: {schema: {"$ref": "#/components/schemas/HandoverResponse"}}}}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
        default: {"$ref": "#/components/responses/DefaultError"}
