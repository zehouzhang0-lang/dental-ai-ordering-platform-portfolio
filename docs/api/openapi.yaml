      parameters:
      - name: nodeInstanceId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 节点已完成
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/CommonResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/NodeActionResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postProcessInstanceNodesByNodeInstanceIdComplete
  "/orders/{orderId}/process-instance/nodes/{nodeInstanceId}/complete-business-gate":
    post:
      tags:
      - ProcessInstance
      summary: 完成客服业务门禁
      description: |
        权限：具有 workflow:operate-business-gate 的 CS 或 ADMIN。
        仅允许处理 READY 状态的“客服定基台”和“客服核对订单信息及账单”节点；
        不允许普通 WORKER 代办，也不把这些节点计入生产进度或生产派工。
        “客服核对订单信息及账单”还要求当前订单已关联一份上传完成的 PDF 账单，
        否则返回 409，不能用空账单或其他订单附件放行业务门禁。
        note 必填，动作写入独立审计后再按 DAG 激活后续节点。
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
      - name: nodeInstanceId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/BusinessGateActionRequest"
      responses:
        '200':
          description: 客服业务门禁已完成
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/CommonResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/NodeActionResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postOrdersByOrderIdProcessInstanceNodesByNodeInstanceIdCompleteBusinessGate
  "/process-instance/nodes/{nodeInstanceId}/skip":
    post:
      tags:
      - ProcessInstance
      summary: 跳过可选工序节点
      description: |
        权限：仅 ADMIN。按二期已确认范围，WORKER 与 CS 均不得跳过生产节点。
        仅允许跳过 is_optional=1 且当前为 PENDING/READY 的节点；reason 必填，并记录
        skipped_at 与 skip_reason。
      parameters:
      - name: nodeInstanceId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SkipNodeRequest"
      responses:
        '200':
          description: 节点已跳过
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/CommonResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/NodeActionResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/DefaultError"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: postProcessInstanceNodesByNodeInstanceIdSkip
