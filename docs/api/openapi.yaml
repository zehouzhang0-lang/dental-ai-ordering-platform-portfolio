    PerformanceStats:
      type: object
      properties:
        user_id:
          type: integer
        performance_formula_version:
          type: string
          enum:
          - PHASE_ONE_DEFAULT_V1
          - STANDARD_TIME_PENDING
          description: |
            任务 9D.74 第一增量：开发默认绩效公式版本。当前公式只用于一期统计验收，不作为工资或奖惩结算依据。
            客户正式标准工时未启用时返回 STANDARD_TIME_PENDING，所有依赖标准工时的指标返回 null。
        username:
          type: string
        completed_count:
          type: integer
          description: 完成工序数
        effective_duration:
          type: integer
          description: 有效工时（分钟）
        standard_duration:
          type: integer
          nullable: true
          description: 有正式标准工时的已完成工序标准工时合计（分钟）；正式开关关闭时返回 null
        standard_covered_count:
          type: integer
          nullable: true
          description: 已完成工序中配置了正式标准工时的数量；正式开关关闭时返回 null
        standard_missing_count:
          type: integer
          nullable: true
          description: 已完成工序中缺少正式标准工时的数量；正式开关关闭时返回 null
        standard_coverage_rate:
          type: integer
          nullable: true
          description: 标准工时覆盖率，取值 0-100；正式开关关闭时返回 null
        rework_count:
          type: integer
          description: 返工次数
        responsible_rework_count:
          type: integer
          description: 责任类型为 WORKER 的返工次数
        non_worker_responsibility_rework_count:
          type: integer
          description: 责任类型为 DOCTOR/CS/SYSTEM 的返工次数
        unclassified_rework_count:
          type: integer
          description: 尚未关闭或未设置责任类型的返工次数
        on_time_rate:
          type: integer
          nullable: true
          description: 准时率，取值 0-100；performance_formula_version=STANDARD_TIME_PENDING 时返回 null
        pass_rate:
          type: integer
          description: 一次通过率，取值 0-100
        duration_efficiency:
          type: integer
          nullable: true
          description: 工时效率（标准工时÷实际工时×100%）；performance_formula_version=STANDARD_TIME_PENDING 时返回 null
        performance_score:
          type: integer
          nullable: true
          description: |
            开发默认绩效分，公式为工时效率 40% + 一次通过率 30% + 准时率 20% + 责任归因 10%；工时效率封顶 120，生产责任返工每次扣 10 分，未归因返工每次扣 5 分，非生产责任返工不扣分。
            客户正式标准工时未启用时 performance_formula_version=STANDARD_TIME_PENDING，本字段返回 null，前端显示待数据。
    StaffWorkloadResponse:
