        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
        default: {"$ref": "#/components/responses/DefaultError"}
  "/exports/{exportRequestId}/download":
    post:
      tags: [Admin]
      summary: 下载导出结果并留痕
      description: |
        权限码：export:execute。只有申请人本人可下载（批准人也不行——批准的是「谁导」而不是「谁都能导」）。
        待审批返回 409，已驳回返回 409。每调用一次写一条 export_audit：操作人、时间、导出范围、行数、字段清单。
        订单派生数据集按调用者的 data_scope 过滤，导出看到的不会多于界面上看得到的。
      operationId: postExportDownload
      parameters:
      - {name: exportRequestId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: CSV 文件
          content:
            text/csv:
              schema: {type: string, format: binary}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
        default: {"$ref": "#/components/responses/DefaultError"}
